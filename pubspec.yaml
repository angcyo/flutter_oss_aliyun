name: flutter_oss_aliyun
description: oss aliyun plugin for flutter and upport STS to access OSS temporarily
repository: https://github.com/huhx/flutter_oss_aliyun
issue_tracker: https://github.com/huhx/flutter_oss_aliyun/issues
topics:
  - aliyun
  - oss
version: 6.4.2

environment:
  sdk: ^3.10.0

dependencies:
  # https://pub.dev/packages/crypto
  crypto: ^3.0.8
  # https://pub.dev/packages/dio
  dio: ^5.11.1
  # https://pub.dev/packages/async
  async: ^2.13.1
  # https://pub.dev/packages/mime
  mime: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

screenshots:
  - description: The aliyun oss logo
    path: screenshots/aliyun_oss.png
